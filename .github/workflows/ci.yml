name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.12.2"
            python: "3.13"
          - homeassistant: "2026.8.0"
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install "homeassistant==${{ matrix.homeassistant }}" -r requirements_test.txt
      - run: ruff check custom_components soundsticks5_audio tests
      - run: python -m compileall -q custom_components soundsticks5_audio
      - run: pytest -q

  audio-app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21 soundsticks5_audio
