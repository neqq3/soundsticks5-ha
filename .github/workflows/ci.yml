name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check custom_components soundsticks5_audio tests
      - run: python -m compileall -q custom_components soundsticks5_audio
      - run: pytest -q

  audio-app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21 soundsticks5_audio
