configuration:
  adapter:
    name: 蓝牙适配器
    description: 可选的 BlueZ 地址、别名或适配器名；留空自动选择。
  device_address:
    name: 经典蓝牙地址
    description: 可选的已配对经典蓝牙地址；不要填写会轮换的 BLE RPA。
  device_alias:
    name: 音箱名称
    description: 未配置地址时用于查找 SoundSticks 5 的名称。
  api_token:
    name: API 令牌
    description: 与 Home Assistant 集成一致的可选 Bearer 令牌。
  auto_connect:
    name: 启动时连接
    description: App 启动时连接此前已配对的音箱。
  auto_reconnect:
    name: 播放时自动重连
    description: 活跃音频任务丢失 A2DP 时重新连接。
  release_after_playback:
    name: 播放后释放
    description: 断开蓝牙音频，让 AUX 或其他音源接管。
  release_delay:
    name: 释放延迟
    description: 释放 A2DP 前等待的秒数。
  max_playback_seconds:
    name: 最大播放时长
    description: 单个队列项目的强制清理超时。
  sink_match:
    name: 音频输出匹配
    description: PulseAudio 输出名称中不区分大小写的匹配文本。
network:
  8099/tcp: 本地集成 API

